# Site settings
title: Zeikar's Lab
email: zeikar.dev@gmail.com
description: >-
  Irregular Apparatus Lab — oddly specific tools, built one at a time.
  Frameworks, web apps, browser extensions, desktop things.
baseurl: ""
url: "https://zeikar.dev"
twitter:
  username: zeikar_dev
  card: summary_large_image
twitter_username: zeikar_dev
github_username: zeikar

# Build settings
markdown: kramdown
highlighter: rouge
sass:
  style: expanded
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from

# Posts permalink (under /blog/) + default layout. Scoped to type: posts only —
# a site-level `permalink` would also rewrite pages like about.html into
# /about/ directory form, breaking existing /about.html and /resume.html URLs.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      lang: en
      permalink: /blog/:title/
  - scope:
      path: "_posts/ko"
      type: posts
    values:
      layout: post
      lang: ko
      permalink: /blog/ko/:title/

# Collections
collections:
  projects:
    output: true
    permalink: /:collection/:name/

# Comments (giscus). Fill in the four values from https://giscus.app
# (after enabling Discussions on the repo and installing the giscus app).
# Leave repo_id empty to disable rendering site-wide.
giscus:
  repo: zeikar/zeikar.github.io
  repo_id: "R_kgDOPod7vA"
  category: Comments
  category_id: "DIC_kwDOPod7vM4C8ny0"

# SEO settings
lang: en
author:
  name: Zeikar
  twitter: zeikar_dev
social:
  name: Zeikar
  links:
    - https://github.com/zeikar

# Additional same-origin URLs to include in sitemap.xml
extra_sitemap_urls:
  - https://zeikar.dev/blog/
  - https://zeikar.dev/atcoder/
  - https://zeikar.dev/leetcode/
  - https://zeikar.dev/javascript-30/
  - https://zeikar.dev/interactive-developer-clone/

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
